name: Tests & CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  unit-tests-and-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  cypress-install:
    name: Cypress Install & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Cypress install and Next.js build
        uses: cypress-io/github-action@v6
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY || secrets.CYPRESS_WEATHER_API_KEY || secrets.WEATHER_APIKEY || 'demo-key' }}
          WEATHER_APIKEY: ${{ secrets.WEATHER_API_KEY || secrets.CYPRESS_WEATHER_API_KEY || secrets.WEATHER_APIKEY || 'demo-key' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          runTests: false
          build: npm run build

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: .next

  cypress-run:
    name: Cypress Tests
    runs-on: ubuntu-latest
    needs: cypress-install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Download the build folder
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Create cypress env
        env:
          API_KEY: ${{ secrets.WEATHER_API_KEY || secrets.CYPRESS_WEATHER_API_KEY || secrets.WEATHER_APIKEY || 'demo-key' }}
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('cypress.env.json', JSON.stringify({ WEATHER_API_KEY: process.env.API_KEY }));"

      - name: Cypress run E2E
        uses: cypress-io/github-action@v6
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY || secrets.CYPRESS_WEATHER_API_KEY || secrets.WEATHER_APIKEY || 'demo-key' }}
          WEATHER_APIKEY: ${{ secrets.WEATHER_API_KEY || secrets.CYPRESS_WEATHER_API_KEY || secrets.WEATHER_APIKEY || 'demo-key' }}
        with:
          start: npm start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome

      - name: Cypress run Component
        uses: cypress-io/github-action@v6
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY || secrets.CYPRESS_WEATHER_API_KEY || secrets.WEATHER_APIKEY || 'demo-key' }}
          WEATHER_APIKEY: ${{ secrets.WEATHER_API_KEY || secrets.CYPRESS_WEATHER_API_KEY || secrets.WEATHER_APIKEY || 'demo-key' }}
        with:
          install: false
          component: true
          browser: chrome
